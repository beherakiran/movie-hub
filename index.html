<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieHub</title>
  </head>

  <body class="bg-black text-white">
      <!-- header -->
    <header class="sticky top-0 z-50 w-full bg-[#0E0F13] px-6 py-4">
      <div
        class="flex flex-col items-center gap-4 md:flex-row md:justify-between"
      >
        <div class="text-3xl font-bold text-[#00A8FF]">MovieHub</div>

        <input
          type="text"
          id="searchInput"
          placeholder="Search movies..."
          class="w-full max-w-md rounded-full border border-gray-700 bg-[#1F2230] px-4 py-2 text-white outline-none focus:border-red-500"
        />
      </div>
    </header>
      <!-- banner -->
    <section
      class="relative h-125 w-full bg-[url('/hero.jpg')] bg-cover bg-center"
    >
      <div class="mx-auto max-w-7xl px-6 py-24">
        <div class="mx-auto max-w-2xl text-center lg:mx-0 lg:text-left">
          <p class="mb-3 font-semibold text-red-500">WELCOME TO MOVIEHUB</p>

          <h1 class="mb-5 text-[2.5rem] font-bold leading-tight lg:text-[4rem]">
            Unlimited Movies & <br />
            Entertainment
          </h1>

          <p class="mb-8 text-[1.1rem] leading-[1.7] text-[#ddd]">
            Discover popular movies around the world,and save movies you want to
            watch later.
          </p>

          <button
            class="rounded-lg bg-[#00A8FF] px-6 py-3 font-semibold hover:bg-red-700"
          >
            Explore Now
          </button>
        </div>
      </div>
    </section>
       <!-- moviecard-container -->
    <section class="px-6 py-10">
      <h2 class="mb-6 text-3xl font-bold">Popular Movies</h2>

      <div
        id="moviesContainer"
        class="mx-4 grid grid-cols-2 gap-6.25 md:grid-cols-3 lg:grid-cols-5"
      ></div>
    </section>
     <!-- modal -->
    <div
      id="movieModal"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-3"
    >
      <div
        class="relative max-h-[85vh] w-full max-w-2xl overflow-y-auto rounded-xl bg-gray-900 p-4 md:max-h-[90vh] md:p-6"
      >
        <button
          id="closeModal"
          class="absolute right-3 top-2 z-10 text-2xl text-gray-400"
        >
          &times;
        </button>

        <div id="modalContent"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
